name: Bug report
description: Report something in the SDK behaving incorrectly
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do **not** file here — follow
        [SECURITY.md](https://github.com/Vero-protocol/vero-sdk/blob/main/SECURITY.md).

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - network (endpoint config / URL validation)
        - rpc (client, failover, health)
        - errors (normalization, codes)
        - types (shared protocol types)
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the error and its `code` if there was one.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal code snippet.
      placeholder: |
        1. Construct an RpcClient with ...
        2. Call request('/...')
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 0.1.0

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"

  - type: markdown
    attributes:
      value: |
        ---
        **If you pick this issue up:** the pull request that closes it needs a
        **detailed description** — what was wrong, the approach you took, anything
        the reviewer should look at closely, and how you verified it. A one-line
        description will be sent back before review. See CONTRIBUTING.md.
