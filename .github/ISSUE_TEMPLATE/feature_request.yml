name: Feature request
description: Propose a new capability for the SDK
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the API look like? A sketch of the call site helps.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which module would this live in?
      options:
        - network
        - rpc
        - errors
        - types
        - a new module
        - not sure
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: Which consumers need this?
      description: >
        Does the relayer, engine, or dashboard need it — and does any of them
        already implement something similar that this would replace?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: markdown
    attributes:
      value: |
        ---
        **If you pick this issue up:** the pull request that closes it needs a
        **detailed description** — what was wrong, the approach you took, anything
        the reviewer should look at closely, and how you verified it. A one-line
        description will be sent back before review. See CONTRIBUTING.md.
